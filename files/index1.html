<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../img/hangingMachine.avif">
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
  <title>Hang The Man Game</title>
</head>

<body class="body">

  <!-- Top-right corner: Intro button + Scoreboard stacked -->
  <div id="top-right">
    <a href="../index.html">
      <button id="intro">Intro</button>
    </a>

    <aside id="scoreboard">
      <h4>📊 Score</h4>
      <p><span id="playerDisplay">👤 Guest</span></p>
      <p><strong>Wins:</strong> <span id="winCount">0</span></p>
      <p><strong>Losses:</strong> <span id="lossCount">0</span></p>
    </aside>
  </div>

  <h1>Hang The Man</h1>
  <div id="drawing"></div>
  <div id="word"></div>
  <div id="message"></div>
  <div id="keyboard"></div>

  <table>
    <tr><th>Guessed</th><th>Remaining</th></tr>
    <tr>
      <td id="guessed"></td>
      <td id="remaining"></td>
    </tr>
  </table>

  <button id="reset">New word</button>

</body>

</html>
